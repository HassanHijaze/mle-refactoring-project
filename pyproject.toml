[project]
name = "mle-refactoring-project"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "fastapi>=0.162.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "skops>=0.14.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
